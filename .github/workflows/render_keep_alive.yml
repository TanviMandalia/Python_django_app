name: Render Service Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render Free Tier containers from idling into sleep
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Health Endpoint
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL || 'https://physio-rehab-app.onrender.com' }}
        run: |
          TARGET="${APP_URL%/}/healthz"
          echo "Pinging healthcheck at: $TARGET"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$TARGET" || echo "000")
          echo "Received HTTP status code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Render container is awake and database is healthy."
          else
            echo "WARNING: Non-200 status ($HTTP_STATUS). Container was triggered to wake up."
          fi
