# ==============================================================================
# Render Blueprint Specification for PhysioRehab Clinic SaaS
# Reference: https://render.com/docs/blueprint-spec
# NOTE: This file is a local deployment manifest for future deployment.
# It does NOT execute external deployment or provision resources automatically.
# ==============================================================================
services:
  # ── Web Application Service ────────────────────────────────────────────────
  - type: web
    name: physio-rehab-app
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn myproject.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: "/healthz"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DJANGO_SETTINGS_MODULE
        value: "myproject.settings.production"
      - key: DATABASE_URL
        fromDatabase:
          name: physio-rehab-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CANONICAL_BASE_URL
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: SECURE_HSTS_PRELOAD
        value: "true"
      - key: DB_CONN_MAX_AGE
        value: "600"
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CLINIC_SMTP_HOST
        value: "smtp.gmail.com"
      - key: CLINIC_SMTP_PORT
        value: "587"
      - key: CLINIC_SMTP_USER
        value: "physio.rehab.guj@gmail.com"
      - key: CLINIC_SMTP_PASSWORD
        sync: false
      - key: GMAIL_SHARED_MAILBOX
        value: "physio.rehab.guj@gmail.com"
      - key: GMAIL_INBOUND_MAILBOXES
        value: "techcraft1215@gmail.com,physio.rehab.guj@gmail.com"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: CLINIC_NOTIFICATION_EMAIL
        value: "physio.rehab.guj@gmail.com"
      - key: CLINIC_UPI_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  # Runs the idempotent one-hour reminder command once per minute. Render Cron
  # Jobs are billed separately (minimum $1/month); see the deployment notes.
  - type: cron
    name: physio-rehab-appointment-reminders
    runtime: python
    plan: 0.5c-512mb
    schedule: "* * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py send_appointment_reminders --settings=myproject.settings.production"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DJANGO_SETTINGS_MODULE
        value: "myproject.settings.production"
      - key: DATABASE_URL
        fromDatabase:
          name: physio-rehab-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          name: physio-rehab-app
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: CLINIC_SMTP_HOST
        fromService:
          name: physio-rehab-app
          type: web
          envVarKey: CLINIC_SMTP_HOST
      - key: CLINIC_SMTP_PORT
        fromService:
          name: physio-rehab-app
          type: web
          envVarKey: CLINIC_SMTP_PORT
      - key: CLINIC_SMTP_USER
        fromService:
          name: physio-rehab-app
          type: web
          envVarKey: CLINIC_SMTP_USER
      - key: CLINIC_SMTP_PASSWORD
        fromService:
          name: physio-rehab-app
          type: web
          envVarKey: CLINIC_SMTP_PASSWORD

# ── Managed PostgreSQL Database ──────────────────────────────────────────────
databases:
  - name: physio-rehab-db
    databaseName: physiorehab_db
    user: physio_user
    plan: free
    ipAllowList: [] # Deny public external access; enforce private networking
