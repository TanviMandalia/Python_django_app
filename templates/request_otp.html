{% extends "layouts/base_public.html" %}
{% load static %}

{% block title %}Forgot Password — PhysioRehab Clinic{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden mt-4">
        <div class="bg-dark text-white p-4 text-center">
          <i class="fas fa-unlock-alt text-warning fs-1 mb-2"></i>
          <h3 class="fw-bold mb-1">Reset Password</h3>
          <p class="text-secondary small mb-0">Enter your registered email to receive an OTP</p>
        </div>
        <div class="card-body p-4 p-md-5 bg-white">
          <form method="POST" action="{% url 'request_otp' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Registered Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
              </div>
            </div>
            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold mt-3 rounded-pill shadow-sm">
              <i class="fas fa-paper-plane me-1"></i> Send OTP Code
            </button>
          </form>
          <div class="text-center mt-4 pt-3 border-top">
            <a href="{% url 'login' %}" class="small text-muted text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
