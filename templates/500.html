{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error (500) — Dr. Dhvani Patalia Physio Rehab</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .error-card {
            background: rgba(31, 41, 55, 0.7);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            padding: 48px 36px;
            max-width: 620px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        .badge-500 {
            display: inline-block;
            font-family: 'Outfit', sans-serif;
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            font-weight: 800;
            color: #ef4444;
            line-height: 1;
            margin-bottom: 12px;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 14px;
        }
        p {
            color: #9ca3af;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-gold {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #F5C518;
            color: #111827;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-gold:hover {
            background: #e0b100;
            transform: translateY(-2px);
        }
        .clinic-support {
            margin-top: 36px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            color: #9ca3af;
        }
        .clinic-support a {
            color: #F5C518;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="error-card">
        <div class="badge-500">500</div>
        <h1>Temporary Server Error</h1>
        <p>Our technical team has been alerted. Please try refreshing the page or return to our homepage shortly.</p>
        <a href="/" class="btn-gold"><i class="fas fa-home"></i> Return to Homepage</a>
        <div class="clinic-support">
            Need immediate appointment assistance? Contact: <a href="tel:9409510501">+91 94095 10501</a>
        </div>
    </main>
</body>
</html>
