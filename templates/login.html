{% extends "layouts/base_public.html" %}
{% load static %}

{% block title %}Log In — PhysioRehab Clinic{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden mt-3">
        <div class="bg-dark text-center p-4 text-white">
          <i class="fas fa-heartbeat text-warning fs-1 mb-2"></i>
          <h3 class="fw-bold mb-1">Welcome Back</h3>
          <p class="text-secondary small mb-0">Sign in to your PhysioRehab portal</p>
        </div>
        <div class="card-body p-4 p-md-5 bg-white">
          <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Username or Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                <input type="text" name="username" class="form-control border-start-0" placeholder="Enter username or email" required autofocus>
              </div>
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-label fw-semibold mb-0">Password</label>
                <a href="{% url 'request_otp' %}" class="small text-decoration-none text-warning">Forgot password?</a>
              </div>
              <div class="input-group mt-1">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control border-start-0" placeholder="Enter your password" required>
              </div>
            </div>
            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold mt-3 rounded-pill shadow-sm">
              <i class="fas fa-sign-in-alt me-1"></i> Sign In
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">Don't have an account?</span>
            <a href="{% url 'register' %}" class="fw-bold text-dark text-decoration-none ms-1">Create Account</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
