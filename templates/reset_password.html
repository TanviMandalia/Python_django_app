{% extends "layouts/base_public.html" %}
{% load static %}

{% block title %}Set New Password — PhysioRehab Clinic{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden mt-4">
        <div class="bg-dark text-white p-4 text-center">
          <i class="fas fa-key text-warning fs-1 mb-2"></i>
          <h3 class="fw-bold mb-1">Set New Password</h3>
          <p class="text-secondary small mb-0">Create a secure password for your account</p>
        </div>
        <div class="card-body p-4 p-md-5 bg-white">
          <form method="POST" action="{% url 'reset_password' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold">New Password</label>
              <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Confirm Password</label>
              <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold mt-3 rounded-pill shadow-sm">
              <i class="fas fa-check-circle me-1"></i> Reset Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
