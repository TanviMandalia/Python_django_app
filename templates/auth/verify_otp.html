{% extends "layouts/base_public.html" %}
{% load static %}

{% block title %}Verify OTP — PhysioRehab Clinic{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden mt-4">
        <div class="bg-dark text-white p-4 text-center">
          <i class="fas fa-shield-alt text-warning fs-1 mb-2"></i>
          <h3 class="fw-bold mb-1">Verify OTP</h3>
          <p class="text-secondary small mb-0">Enter the 6-digit code sent to {{ email }}</p>
        </div>
        <div class="card-body p-4 p-md-5 bg-white">
          <form method="POST" action="{% url 'verify_otp' %}">
            {% csrf_token %}
            <div class="mb-3 text-center">
              <label class="form-label fw-semibold text-dark">Enter 6-Digit Code</label>
              <input type="text" name="otp" class="form-control text-center fs-3 letter-spacing-2 fw-bold" maxlength="6" placeholder="------" required autofocus>
            </div>
            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold mt-3 rounded-pill shadow-sm">
              <i class="fas fa-check me-1"></i> Verify OTP
            </button>
          </form>
          <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top small">
            <a href="{% url 'resend_otp' %}" class="text-warning text-decoration-none"><i class="fas fa-redo me-1"></i> Resend OTP</a>
            <a href="{% url 'login' %}" class="text-muted text-decoration-none">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
