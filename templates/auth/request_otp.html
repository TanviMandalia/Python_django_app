<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<style>
/* ===============================
   RESET
================================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --border:#d1d5db;
    --danger:#dc2626;
    --radius:14px;
    --shadow:0 15px 35px rgba(0,0,0,.08);
}

body{
    font-family:"Segoe UI",sans-serif;
    background:linear-gradient(135deg,#eef4ff,#f8fbff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:var(--text);
}

/* ===============================
   CARD
================================= */

.auth-card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:40px;
    animation:fade .5s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.auth-card h2{
    text-align:center;
    margin-bottom:12px;
    font-size:30px;
    color:var(--text);
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:30px;
    font-size:15px;
}

/* ===============================
   FORM
================================= */

form{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:8px;
    font-weight:600;
    color:#374151;
}

input{
    width:100%;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:15px;
    transition:.3s;
    outline:none;
}

input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

button{
    border:none;
    cursor:pointer;
    background:var(--primary);
    color:#fff;
    padding:14px;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

button:hover{
    background:var(--primary-dark);
    transform:translateY(-2px);
}

button:active{
    transform:scale(.98);
}

.error{
    margin-top:18px;
    background:#fee2e2;
    color:var(--danger);
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-size:14px;
}

.footer-link{
    margin-top:25px;
    text-align:center;
    font-size:15px;
}

.footer-link a{
    color:var(--primary);
    text-decoration:none;
    font-weight:600;
}

.footer-link a:hover{
    text-decoration:underline;
}

/* ===============================
   RESPONSIVE
================================= */

@media(max-width:768px){

    .auth-card{
        padding:30px 25px;
    }

    .auth-card h2{
        font-size:26px;
    }

}

@media(max-width:480px){

    body{
        padding:15px;
    }

    .auth-card{
        padding:25px 20px;
        border-radius:12px;
    }

    .auth-card h2{
        font-size:24px;
    }

    button{
        font-size:15px;
    }

}

@media(max-width:350px){

    .auth-card{
        padding:20px 15px;
    }

    input{
        padding:12px;
    }

    button{
        padding:12px;
    }

}

/* ===============================
   ACCESSIBILITY
================================= */

button:focus,
input:focus,
a:focus{
    outline:none;
}

::placeholder{
    color:#9ca3af;
}
</style>

</head>
<body>

<div class="auth-card">

    <h2>Forgot Password</h2>

    <p class="subtitle">
        Enter your registered email address to receive an OTP.
    </p>

    <form method="POST" action="{% url 'request_otp' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <button type="submit">
            Send OTP
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <div class="footer-link">
        <a href="{% url 'login' %}">
            Back to Login
        </a>
    </div>

</div>

</body>
</html>
